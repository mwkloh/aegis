[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "aegis"
version = "0.0.1"
description = "AEGIS — local-first, guarded cognitive system. Runtime / Reflection / Improvement planes."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Michael Loh" }]
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "python-dotenv>=1.0",
  "structlog>=24.1",
  "ollama>=0.3",
  "tenacity>=8.2",
  "sqlite-utils>=3.36",
  "sqlite-vec>=0.1.3",
  "defusedxml>=0.7.1",
  "beautifulsoup4>=4.12",
  "bleach>=6.1",
  "python-telegram-bot>=21.0",
  "jsonschema>=4.20",
  "croniter>=2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "pytest-mock>=3.12",
  "respx>=0.21",
  "ruff>=0.5",
  "mypy>=1.10",
  "bandit>=1.7",
  "types-PyYAML",
  "types-bleach",
  "types-jsonschema",
]

[project.scripts]
aegis = "runtime.chat.cli:main"
aegis-doctor = "scripts.doctor:main"
aegis-bootstrap = "scripts.bootstrap_aegis_home:main"
aegis-telegram-smoke = "scripts.telegram_smoke:main"
aegis-skill-add = "scripts.skill_add:main"

[tool.hatch.build.targets.wheel]
packages = ["runtime", "memory", "scripts"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-q --strict-markers --strict-config"
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "e2e: end-to-end vertical-slice tests",
  "unit: fast unit tests",
  "integration: cross-component tests",
]

[tool.coverage.run]
branch = true
source = ["runtime", "memory"]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 80
