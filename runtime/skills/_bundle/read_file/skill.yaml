id: read_file
version: 0.1.0
description: Read the text content of a local file.
intents:
  - read_file
tool: files_read
args_schema:
  type: object
  properties:
    path:
      type: string
      minLength: 1
      maxLength: 512
      description: >-
        Absolute path to the file (e.g. /Users/michaelloh/Desktop/foo.png).
        '~' is allowed. Relative paths and bare filenames are rejected.
  required:
    - path
requires_tier1: true
