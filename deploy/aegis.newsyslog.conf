# newsyslog config for AEGIS launchd output. Install with:
#   sudo cp deploy/aegis.newsyslog.conf /etc/newsyslog.d/aegis.conf
#
# Substitute __AEGIS_ROOT__ for your absolute aegis root path
# (e.g. /Users/alice/.aegis) and __USER__ for the macOS account that runs the
# bot (`id -un`) before installing. One-liner:
#   sed -e "s#__AEGIS_ROOT__#$HOME/.aegis#g" -e "s#__USER__#$(id -un)#g" \
#     deploy/aegis.newsyslog.conf | sudo tee /etc/newsyslog.d/aegis.conf
#
# Format: <logfile> <owner:group> <mode> <count> <size_kb> <when> <flags>
# Rotates at 10MB or daily, keeps 7 archives, gz-compresses.
__AEGIS_ROOT__/logs/aegis.stdout.log         __USER__:staff  644  7  10240  *  GZ
__AEGIS_ROOT__/logs/aegis.stderr.log         __USER__:staff  644  7  10240  *  GZ
__AEGIS_ROOT__/logs/aegis-backup.stdout.log  __USER__:staff  644  7  10240  *  GZ
__AEGIS_ROOT__/logs/aegis-backup.stderr.log  __USER__:staff  644  7  10240  *  GZ
